<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spin the Wheel — Student Picker</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <!-- <script type="module" src="script.js"></script> -->
  </head>
  <body>
    <div class="app">
      <h1>Spin the Wheel — Student Picker</h1>
      <div class="two-col">
        <div class="sidebar">
          <div class="sidebar-title">My classes</div>
          <div class="class-list" id="classList"></div>
          <div class="new-class-row">
            <input
              type="text"
              id="newClassName"
              placeholder="New class name…"
              maxlength="30" />
            <button onclick="createClass()" title="Add class">
              <i class="ti ti-plus"></i>
            </button>
          </div>
        </div>

        <div class="main-panel">
          <div class="empty-state" id="emptyState">
            <i
              class="ti ti-school"
              style="
                font-size: 32px;
                display: block;
                margin-bottom: 8px;
                opacity: 0.4;
              "></i>
            Create or select a class to get started
          </div>

          <div id="classEditor" style="display: none">
            <div class="panel-header">
              <span id="classTitle" class="panel-title"></span>
              <button class="btn" onclick="startRename()" title="Rename class">
                <i class="ti ti-edit"></i>
              </button>
              <button class="btn btn-accent" onclick="openBulk()">
                <i class="ti ti-list"></i> Add multiple
              </button>
            </div>

            <!-- Add student row -->
            <div class="top-bar">
              <input
                type="text"
                id="nameInput"
                placeholder="Add one student…"
                maxlength="30" />
              <div class="gender-toggle">
                <button
                  id="addGenderBoy"
                  onclick="setAddGender('boy')"
                  class="active-boy">
                  ♂ Boy
                </button>
                <button id="addGenderGirl" onclick="setAddGender('girl')">
                  ♀ Girl
                </button>
              </div>
              <button class="btn" onclick="addName()">
                <i class="ti ti-plus"></i> Add
              </button>
            </div>

            <!-- Alternating mode bar -->
            <div class="mode-bar">
              <span class="mode-label">Alternating mode</span>
              <span class="mode-next" id="modeNext"></span>
              <label class="toggle-switch">
                <input
                  type="checkbox"
                  id="alternateToggle"
                  onchange="toggleAlternate()" />
                <span class="toggle-slider"></span>
              </label>
            </div>

            <p class="name-list-label" id="nameListLabel"></p>
            <div class="name-list" id="nameList"></div>

            <div class="wheel-area">
              <div class="wheel-wrap">
                <div class="pointer"></div>
                <canvas id="wheelCanvas" width="300" height="300"></canvas>
              </div>
              <div class="result-box" id="resultBox">Add students to spin!</div>
              <div class="controls">
                <button
                  class="btn btn-spin"
                  id="spinBtn"
                  onclick="spin()"
                  disabled>
                  Spin!
                </button>
                <button class="btn" onclick="resetWheel()">
                  <i class="ti ti-refresh"></i> Reset
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bulk add modal -->
    <div class="modal-overlay" id="bulkModal">
      <div class="modal">
        <h3>Add multiple students</h3>
        <p>One name per line or comma-separated. Duplicates are skipped.</p>
        <textarea
          id="bulkText"
          placeholder="e.g.&#10;Alice&#10;Bob, Carlos&#10;Diana"></textarea>
        <div class="bulk-gender-row">
          <span>Assign as:</span>
          <div class="gender-toggle">
            <button
              id="bulkGenderBoy"
              onclick="setBulkGender('boy')"
              class="active-boy">
              ♂ Boy
            </button>
            <button id="bulkGenderGirl" onclick="setBulkGender('girl')">
              ♀ Girl
            </button>
          </div>
          <span style="font-size: 12px; color: #888"
            >(you can change individually after)</span
          >
        </div>
        <div class="modal-btns">
          <button class="btn" onclick="closeBulk()">Cancel</button>
          <button class="btn btn-spin" onclick="confirmBulk()">
            <i class="ti ti-check"></i> Add all
          </button>
        </div>
      </div>
    </div>

    <script>
      // ── Colours: boy slices use blues/greens, girl slices use pinks/purples
      const BOY_COLORS = [
        ["#E6F1FB", "#185FA5"],
        ["#EAF3DE", "#3B6D11"],
        ["#E1F5EE", "#0F6E56"],
        ["#E6F1FB", "#0C447C"],
      ];
      const GIRL_COLORS = [
        ["#FBEAF0", "#993556"],
        ["#EEEDFE", "#534AB7"],
        ["#FAECE7", "#993C1D"],
        ["#FBEAF0", "#712B13"],
      ];
      const NEUTRAL_COLORS = [
        ["#EEEDFE", "#534AB7"],
        ["#E1F5EE", "#0F6E56"],
        ["#FAECE7", "#993C1D"],
        ["#FBEAF0", "#993556"],
        ["#E6F1FB", "#185FA5"],
        ["#EAF3DE", "#3B6D11"],
        ["#FAEEDA", "#854F0B"],
        ["#FCEBEB", "#A32D2D"],
      ];

      const DEMO_BOYS = [
        "Ethan",
        "Carlos",
        "George",
        "Ivan",
        "Kevin",
        "Mike",
        "Oscar",
        "Victor",
      ];
      const DEMO_GIRLS = [
        "Alice",
        "Diana",
        "Fatima",
        "Hannah",
        "Jasmine",
        "Laura",
        "Nina",
        "Priya",
      ];
      const PREBUILT = [
        {
          name: "Math 101",
          students: [
            { n: "Alice", g: "girl" },
            { n: "Bob", g: "boy" },
            { n: "Carlos", g: "boy" },
            { n: "Diana", g: "girl" },
            { n: "Ethan", g: "boy" },
            { n: "Fatima", g: "girl" },
            { n: "George", g: "boy" },
            { n: "Hannah", g: "girl" },
          ],
        },
        {
          name: "Science 5A",
          students: [
            { n: "Ivan", g: "boy" },
            { n: "Jasmine", g: "girl" },
            { n: "Kevin", g: "boy" },
            { n: "Laura", g: "girl" },
            { n: "Mike", g: "boy" },
            { n: "Nina", g: "girl" },
            { n: "Oscar", g: "boy" },
            { n: "Priya", g: "girl" },
          ],
        },
        {
          name: "English B",
          students: [
            { n: "Quinn", g: "girl" },
            { n: "Rosa", g: "girl" },
            { n: "Sam", g: "boy" },
            { n: "Tina", g: "girl" },
            { n: "Uma", g: "girl" },
            { n: "Victor", g: "boy" },
            { n: "Wendy", g: "girl" },
            { n: "Xander", g: "boy" },
            { n: "Yara", g: "girl" },
            { n: "Zoe", g: "girl" },
          ],
        },
      ];

      const TAU = Math.PI * 2;
      const POINTER_ANGLE = -Math.PI / 2;
      const CX = 150,
        CY = 150,
        R = 145;

      let classes = {},
        activeId = null;
      // allNames: array of {n: string, g: 'boy'|'girl'|''}
      let allNames = [],
        removed = new Set(),
        lastWinner = null;
      let spinning = false,
        angle = 0,
        animId = null;
      let alternateMode = false; // is alternating mode on?
      let nextTurn = "boy"; // whose turn it is when alternating
      let addGender = "boy"; // gender selected in add row
      let bulkGender = "boy"; // gender selected in bulk modal

      const canvas = document.getElementById("wheelCanvas");
      const ctx = canvas.getContext("2d");

      // ── Storage
      function save() {
        try {
          localStorage.setItem("wheelClasses", JSON.stringify(classes));
          localStorage.setItem("wheelActive", activeId || "");
        } catch (e) {}
      }
      function loadStorage() {
        try {
          const d = localStorage.getItem("wheelClasses");
          if (d) classes = JSON.parse(d);
          const a = localStorage.getItem("wheelActive");
          if (a && classes[a]) activeId = a;
        } catch (e) {}
      }
      loadStorage();
      // Migrate old format (students as strings) to new format (objects with {n,g})
      Object.values(classes).forEach((c) => {
        c.students = c.students.map((s) =>
          typeof s === "string" ? { n: s, g: "" } : s,
        );
      });
      if (!Object.keys(classes).length) {
        PREBUILT.forEach((p) => {
          const id = uid();
          classes[id] = {
            name: p.name,
            students: p.students.map((s) => ({ ...s })),
          };
        });
        save();
      }

      function uid() {
        return "c" + Date.now() + Math.random().toString(36).slice(2, 6);
      }
      function esc(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function normaliseAngle(a) {
        return ((a % TAU) + TAU) % TAU;
      }

      // Returns remaining students (not removed this session), filtered by gender if alternating
      function getRemaining(genderFilter) {
        const base = allNames.filter((s) => !removed.has(s.n));
        if (!genderFilter) return base;
        const filtered = base.filter((s) => s.g === genderFilter);
        // If no one left in that gender, fall back to everyone remaining
        return filtered.length > 0 ? filtered : base;
      }

      // ── Gender toggle (add row)
      function setAddGender(g) {
        addGender = g;
        document.getElementById("addGenderBoy").className =
          g === "boy" ? "active-boy" : "";
        document.getElementById("addGenderGirl").className =
          g === "girl" ? "active-girl" : "";
      }
      function setBulkGender(g) {
        bulkGender = g;
        document.getElementById("bulkGenderBoy").className =
          g === "boy" ? "active-boy" : "";
        document.getElementById("bulkGenderGirl").className =
          g === "girl" ? "active-girl" : "";
      }

      // ── Alternate toggle
      function toggleAlternate() {
        alternateMode = document.getElementById("alternateToggle").checked;
        nextTurn = "boy"; // always start with boys when enabling
        updateModeBar();
        drawWheel();
        updateUI();
      }
      function updateModeBar() {
        const el = document.getElementById("modeNext");
        if (!alternateMode) {
          el.innerHTML =
            '<span style="color:#888">Off — picks randomly from everyone</span>';
          return;
        }
        const label =
          nextTurn === "boy"
            ? '<span class="next-boy">♂ Boy\'s turn next</span>'
            : '<span class="next-girl">♀ Girl\'s turn next</span>';
        el.innerHTML = label;
      }

      // ── Toggle a student's gender in the name list
      function toggleStudentGender(name) {
        if (!activeId) return;
        const s = classes[activeId].students.find((s) => s.n === name);
        if (!s) return;
        s.g = s.g === "boy" ? "girl" : s.g === "girl" ? "" : "boy";
        const local = allNames.find((s) => s.n === name);
        if (local) local.g = s.g;
        save();
        renderNameList();
        drawWheel();
      }

      // ── Sidebar
      function renderSidebar() {
        const el = document.getElementById("classList"),
          ids = Object.keys(classes);
        if (!ids.length) {
          el.innerHTML =
            '<p style="font-size:12px;color:#888;padding:4px 0;">No classes yet</p>';
          return;
        }
        el.innerHTML = ids
          .map((id) => {
            const c = classes[id];
            return `<div class="class-item${id === activeId ? " active" : ""}" onclick="selectClass('${id}')">
        <span class="ci-name">${esc(c.name)}</span>
        <span class="ci-count">${c.students.length}</span>
        <button class="ci-del" onclick="deleteClass(event,'${id}')" title="Delete"><i class="ti ti-trash" style="font-size:13px;"></i></button>
      </div>`;
          })
          .join("");
      }
      function createClass() {
        const inp = document.getElementById("newClassName"),
          name = inp.value.trim();
        if (!name) return;
        const id = uid();
        classes[id] = { name, students: [] };
        inp.value = "";
        save();
        selectClass(id);
      }
      function deleteClass(e, id) {
        e.stopPropagation();
        if (!confirm('Delete "' + classes[id].name + '"?')) return;
        delete classes[id];
        if (activeId === id) {
          activeId = null;
          showEmpty();
        }
        save();
        renderSidebar();
      }
      function selectClass(id) {
        activeId = id;
        allNames = classes[id].students.map((s) => ({ ...s }));
        removed = new Set();
        lastWinner = null;
        angle = 0;
        spinning = false;
        nextTurn = "boy";
        if (animId) cancelAnimationFrame(animId);
        save();
        renderSidebar();
        showEditor();
      }
      function showEmpty() {
        document.getElementById("emptyState").style.display = "";
        document.getElementById("classEditor").style.display = "none";
      }
      function showEditor() {
        const c = classes[activeId];
        document.getElementById("emptyState").style.display = "none";
        document.getElementById("classEditor").style.display = "";
        document.getElementById("classTitle").textContent = c.name;
        document.getElementById("resultBox").textContent = c.students.length
          ? "Ready to spin!"
          : "Add students to spin!";
        document.getElementById("alternateToggle").checked = alternateMode;
        updateModeBar();
        renderNameList();
        drawWheel();
        updateUI();
      }
      function startRename() {
        const c = classes[activeId],
          t = document.getElementById("classTitle");
        t.outerHTML = `<input class="edit-name-input" id="classTitle" value="${esc(c.name)}" onblur="finishRename()" onkeydown="if(event.key==='Enter')this.blur()" />`;
        document.getElementById("classTitle").focus();
      }
      function finishRename() {
        const inp = document.getElementById("classTitle"),
          val = inp.value.trim() || classes[activeId].name;
        classes[activeId].name = val;
        save();
        renderSidebar();
        inp.outerHTML = `<span class="panel-title" id="classTitle">${esc(val)}</span>`;
      }

      // ── Add / bulk add
      function addName() {
        const inp = document.getElementById("nameInput"),
          val = inp.value.trim();
        if (!val || !activeId) return;
        if (!classes[activeId].students.find((s) => s.n === val)) {
          const student = { n: val, g: addGender };
          classes[activeId].students.push(student);
          allNames.push({ ...student });
          save();
        }
        inp.value = "";
        renderNameList();
        drawWheel();
        updateUI();
        renderSidebar();
      }
      function openBulk() {
        document.getElementById("bulkText").value = "";
        document.getElementById("bulkModal").classList.add("open");
        document.getElementById("bulkText").focus();
      }
      function closeBulk() {
        document.getElementById("bulkModal").classList.remove("open");
      }
      function confirmBulk() {
        const names = document
          .getElementById("bulkText")
          .value.split(/[\n,]/)
          .map((s) => s.trim())
          .filter((s) => s.length > 0 && s.length <= 30);
        let added = 0;
        names.forEach((n) => {
          if (!classes[activeId].students.find((s) => s.n === n)) {
            const student = { n, g: bulkGender };
            classes[activeId].students.push(student);
            allNames.push({ ...student });
            added++;
          }
        });
        save();
        renderNameList();
        drawWheel();
        updateUI();
        renderSidebar();
        closeBulk();
        if (added > 0)
          document.getElementById("resultBox").textContent =
            `Added ${added} student${added > 1 ? "s" : ""}!`;
      }

      // ── Click name tag: first click = confirm prompt, second = remove from session
      function handleTagClick(name) {
        const tags = document.querySelectorAll(".name-tag");
        let found = null;
        tags.forEach((t) => {
          if (t.dataset.name === name) found = t;
        });
        if (!found) return;
        if (found.classList.contains("confirm-remove")) {
          removed.add(name);
          if (lastWinner === name) lastWinner = null;
          renderNameList();
          drawWheel();
          updateUI();
          return;
        }
        document
          .querySelectorAll(".name-tag.confirm-remove")
          .forEach((t) => t.classList.remove("confirm-remove"));
        found.classList.add("confirm-remove");
        setTimeout(() => {
          if (found && found.classList.contains("confirm-remove"))
            found.classList.remove("confirm-remove");
        }, 2000);
      }

      // ── Name list rendering
      function renderNameList() {
        const el = document.getElementById("nameList"),
          label = document.getElementById("nameListLabel");
        if (!activeId || !allNames.length) {
          el.innerHTML =
            '<p class="hint">No students yet — add names above</p>';
          label.textContent = "";
          return;
        }
        const boys = allNames.filter((s) => s.g === "boy").length;
        const girls = allNames.filter((s) => s.g === "girl").length;
        const unset = allNames.filter((s) => !s.g).length;
        let info = `${boys} ♂ boys · ${girls} ♀ girls`;
        if (unset) info += ` · ${unset} untagged`;
        if (removed.size) info += ` · ${removed.size} removed this round`;
        label.textContent =
          info + " — click ♂/♀ to change, click name to remove from round";

        el.innerHTML = allNames
          .map((s) => {
            const isWinner = s.n === lastWinner,
              isRemoved = removed.has(s.n);
            const gCls = s.g === "boy" ? "boy" : s.g === "girl" ? "girl" : "";
            const cls = [
              "name-tag",
              gCls,
              isWinner ? "winner" : "",
              isRemoved ? "removed" : "",
            ]
              .filter(Boolean)
              .join(" ");
            const gLabel = s.g === "boy" ? "♂" : s.g === "girl" ? "♀" : "?";
            const gTitle =
              s.g === "boy"
                ? "Boy — click to change"
                : s.g === "girl"
                  ? "Girl — click to change"
                  : "Untagged — click to set";
            return `<div class="${cls}" data-name="${esc(s.n)}" onclick="handleTagClick('${s.n.replace(/'/g, "\\'")}')">
        <span>${esc(s.n)}</span>
        <button class="tag-gender-btn" onclick="event.stopPropagation();toggleStudentGender('${s.n.replace(/'/g, "\\'")}') " title="${gTitle}">${gLabel}</button>
        <button class="tag-remove-btn" onclick="event.stopPropagation();handleTagClick('${s.n.replace(/'/g, "\\'")}') " title="Remove from this round">×</button>
      </div>`;
          })
          .join("");
      }

      function updateUI() {
        const rem = getRemaining(alternateMode ? nextTurn : null);
        const btn = document.getElementById("spinBtn");
        btn.disabled = rem.length < 1 || spinning;
        updateModeBar();
        if (getRemaining().length === 0 && allNames.length > 0 && !spinning)
          document.getElementById("resultBox").textContent =
            "Everyone picked! Hit reset.";
      }

      // ── Draw wheel
      function drawWheel() {
        const spinPool = getRemaining(alternateMode ? nextTurn : null);
        const n = spinPool.length;
        ctx.clearRect(0, 0, 300, 300);
        if (n === 0) {
          ctx.beginPath();
          ctx.arc(CX, CY, R, 0, TAU);
          ctx.fillStyle = "#E1F5EE";
          ctx.fill();
          ctx.strokeStyle = "#9FE1CB";
          ctx.lineWidth = 3;
          ctx.stroke();
          ctx.fillStyle = "#0F6E56";
          ctx.font = "500 14px system-ui,sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("All done!", CX, CY + 5);
          return;
        }
        const slice = TAU / n;
        spinPool.forEach((student, i) => {
          const isWinner = student.n === lastWinner;
          let bg, fg;
          if (isWinner) {
            bg = "#FFF3CD";
            fg = "#7A4F01";
          } else if (student.g === "boy") {
            const c = BOY_COLORS[i % BOY_COLORS.length];
            bg = c[0];
            fg = c[1];
          } else if (student.g === "girl") {
            const c = GIRL_COLORS[i % GIRL_COLORS.length];
            bg = c[0];
            fg = c[1];
          } else {
            const c = NEUTRAL_COLORS[i % NEUTRAL_COLORS.length];
            bg = c[0];
            fg = c[1];
          }

          const start = angle + i * slice,
            end = start + slice;
          ctx.beginPath();
          ctx.moveTo(CX, CY);
          ctx.arc(CX, CY, R, start, end);
          ctx.closePath();
          ctx.fillStyle = bg;
          ctx.fill();
          ctx.strokeStyle = isWinner ? "#F0B429" : fg;
          ctx.lineWidth = isWinner ? 3 : 2;
          ctx.stroke();

          const mid = start + slice / 2;
          ctx.save();
          ctx.translate(CX, CY);
          ctx.rotate(mid);
          ctx.textAlign = "right";
          const fs = n > 8 ? 11 : n > 5 ? 13 : 14;
          ctx.font = `${isWinner ? "700" : "500"} ${fs}px system-ui,sans-serif`;
          ctx.fillStyle = isWinner ? "#7A4F01" : fg;
          ctx.fillText(
            student.n.length > 14 ? student.n.slice(0, 13) + "…" : student.n,
            R - 8,
            5,
          );
          ctx.restore();
        });
        ctx.beginPath();
        ctx.arc(CX, CY, 18, 0, TAU);
        ctx.fillStyle = "#fff";
        ctx.fill();
        ctx.strokeStyle = "#ccc";
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      // ── Spin
      function spin() {
        const spinPool = getRemaining(alternateMode ? nextTurn : null);
        if (spinning || spinPool.length === 0) return;
        lastWinner = null;
        spinning = true;
        document.getElementById("spinBtn").disabled = true;
        document.getElementById("resultBox").textContent = "🎲 Spinning…";

        const n = spinPool.length;
        const sliceSize = TAU / n;
        const winnerIdx = Math.floor(Math.random() * n);

        const targetAngle =
          POINTER_ANGLE - winnerIdx * sliceSize - sliceSize / 2;
        const curNorm = normaliseAngle(angle);
        const tgtNorm = normaliseAngle(targetAngle);
        let fwd = tgtNorm - curNorm;
        if (fwd < 0.001) fwd += TAU;

        const extraSpins = TAU * (5 + Math.floor(Math.random() * 4));
        const totalRotation = extraSpins + fwd;
        const startAngle = angle;
        let startTime = null;
        const duration = 3500 + Math.random() * 1000;
        function ease(t) {
          return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function frame(ts) {
          if (!startTime) startTime = ts;
          const progress = Math.min((ts - startTime) / duration, 1);
          angle = startAngle + ease(progress) * totalRotation;
          drawWheel();
          if (progress < 1) {
            animId = requestAnimationFrame(frame);
          } else {
            angle = normaliseAngle(startAngle + totalRotation);
            spinning = false;
            const winner = spinPool[winnerIdx];
            lastWinner = winner.n;
            // Advance turn in alternating mode
            if (alternateMode) nextTurn = nextTurn === "boy" ? "girl" : "boy";
            const turnLabel =
              winner.g === "boy" ? "♂ " : winner.g === "girl" ? "♀ " : "";
            document.getElementById("resultBox").textContent =
              `🎉 ${turnLabel}${winner.n}! (click their name to remove)`;
            renderNameList();
            drawWheel();
            updateUI();
          }
        }
        animId = requestAnimationFrame(frame);
      }

      // ── Reset (session only — class roster untouched)
      function resetWheel() {
        if (animId) cancelAnimationFrame(animId);
        spinning = false;
        angle = 0;
        removed = new Set();
        lastWinner = null;
        nextTurn = "boy";
        document.getElementById("resultBox").textContent = allNames.length
          ? "Ready to spin!"
          : "Add students to spin!";
        updateModeBar();
        renderNameList();
        drawWheel();
        updateUI();
      }

      // ── Event listeners
      document
        .getElementById("bulkModal")
        .addEventListener("click", function (e) {
          if (e.target === this) closeBulk();
        });
      document.getElementById("nameInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") addName();
      });
      document
        .getElementById("newClassName")
        .addEventListener("keydown", (e) => {
          if (e.key === "Enter") createClass();
        });
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".name-tag"))
          document
            .querySelectorAll(".name-tag.confirm-remove")
            .forEach((t) => t.classList.remove("confirm-remove"));
      });

      // ── Boot
      renderSidebar();
      if (activeId && classes[activeId]) selectClass(activeId);
      else {
        const ids = Object.keys(classes);
        if (ids.length) selectClass(ids[0]);
      }
    </script>
  </body>
</html>
