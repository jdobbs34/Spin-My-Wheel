<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spin the Wheel — Student Picker</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <script tyoe="module" src="script.js" defer></script>
  </head>
  <body>
    <div class="app">
      <h1>Spin the Wheel — Student Picker</h1>
      <div class="two-col">
        <!-- ── Sidebar ── -->
        <div class="sidebar">
          <div class="sidebar-title">My classes</div>
          <div class="class-list" id="classList"></div>
          <div class="new-class-row">
            <input
              type="text"
              id="newClassName"
              placeholder="New class name…"
              maxlength="30" />
            <button onclick="createClass()" title="Add class">
              <i class="ti ti-plus"></i>
            </button>
          </div>

          <!-- Groups ladder -->
          <div class="groups-section" id="groupsSection" style="display: none">
            <div class="groups-header">
              <span class="groups-header-title">Groups</span>
              <button onclick="clearGroups()" title="Clear groups">
                ✕ Clear
              </button>
            </div>
            <div class="group-count-row">
              <span>Split into</span>
              <input type="number" id="groupCount" value="2" min="2" max="10" />
              <span>groups</span>
              <button onclick="autoSplit()">Auto split</button>
            </div>
            <div class="group-list" id="groupList"></div>
          </div>
        </div>

        <!-- ── Main panel ── -->
        <div class="main-panel">
          <div class="empty-state" id="emptyState">
            <i
              class="ti ti-school"
              style="
                font-size: 32px;
                display: block;
                margin-bottom: 8px;
                opacity: 0.4;
              "></i>
            Create or select a class to get started
          </div>

          <div id="classEditor" style="display: none">
            <div class="panel-header">
              <span id="classTitle" class="panel-title"></span>
              <button class="btn" onclick="startRename()" title="Rename class">
                <i class="ti ti-edit"></i>
              </button>
              <button class="btn btn-accent" onclick="openBulk()">
                <i class="ti ti-list"></i> Add multiple
              </button>
            </div>

            <div class="top-bar">
              <input
                type="text"
                id="nameInput"
                placeholder="Add one student…"
                maxlength="30" />
              <div class="gender-toggle">
                <button
                  id="addGenderBoy"
                  onclick="setAddGender('boy')"
                  class="active-boy">
                  ♂ Boy
                </button>
                <button id="addGenderGirl" onclick="setAddGender('girl')">
                  ♀ Girl
                </button>
              </div>
              <button class="btn" onclick="addName()">
                <i class="ti ti-plus"></i> Add
              </button>
            </div>

            <div class="mode-bar">
              <div class="mode-seg" id="modeSeg">
                <button data-mode="all" onclick="setTurnMode('all')">
                  Everyone
                </button>
                <button data-mode="gender" onclick="setTurnMode('gender')">
                  ♂ vs ♀
                </button>
                <button data-mode="group" onclick="setTurnMode('group')">
                  Group vs Group
                </button>
              </div>
              <div class="turn-chips" id="turnChips"></div>
            </div>

            <p class="name-list-label" id="nameListLabel"></p>
            <div class="name-list" id="nameList"></div>

            <div class="wheel-area">
              <div
                id="groupTurnBanner"
                style="
                  display: none;
                  width: 100%;
                  max-width: 300px;
                  text-align: center;
                  padding: 8px 16px;
                  border-radius: 10px;
                  font-size: 14px;
                  font-weight: 500;
                  border: 0.5px solid #ddd;
                  background: #fff;
                "></div>
              <div class="wheel-wrap" style="position: relative">
                <div class="pointer"></div>
                <canvas id="wheelCanvas" width="300" height="300"></canvas>
                <div class="wheel-tooltip" id="wheelTooltip"></div>
              </div>
              <div class="result-box" id="resultBox">Add students to spin!</div>
              <div class="controls">
                <button
                  class="btn btn-spin"
                  id="spinBtn"
                  onclick="spin()"
                  disabled>
                  Spin!
                </button>
                <button
                  class="btn"
                  id="skipBtn"
                  onclick="skipTurn()"
                  title="Skip to the next team without picking anyone (e.g. accidental spin)">
                  ⏭ Skip
                </button>
                <button class="btn" onclick="resetWheel()">
                  <i class="ti ti-refresh"></i> Reset
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bulk modal -->
    <div class="modal-overlay" id="bulkModal">
      <div class="modal">
        <h3>Add multiple students</h3>
        <p>One name per line or comma-separated. Duplicates are skipped.</p>
        <textarea
          id="bulkText"
          placeholder="e.g.&#10;Alice&#10;Bob, Carlos&#10;Diana"></textarea>
        <div class="bulk-gender-row">
          <span>Assign as:</span>
          <div class="gender-toggle">
            <button
              id="bulkGenderBoy"
              onclick="setBulkGender('boy')"
              class="active-boy">
              ♂ Boy
            </button>
            <button id="bulkGenderGirl" onclick="setBulkGender('girl')">
              ♀ Girl
            </button>
          </div>
        </div>
        <div class="modal-btns">
          <button class="btn" onclick="closeBulk()">Cancel</button>
          <button class="btn btn-spin" onclick="confirmBulk()">
            <i class="ti ti-check"></i> Add all
          </button>
        </div>
      </div>
    </div>

    <!-- Edit name modal -->
    <div class="modal-overlay" id="editModal">
      <div class="modal">
        <h3>Edit student name</h3>
        <p>Fix any spelling mistakes below.</p>
        <input type="text" id="editNameInput" maxlength="30" />
        <div class="modal-btns">
          <button class="btn" onclick="closeEdit()">Cancel</button>
          <button class="btn btn-spin" onclick="confirmEdit()">
            <i class="ti ti-check"></i> Save
          </button>
        </div>
      </div>
    </div>

  </body>
</html>
